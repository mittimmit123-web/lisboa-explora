<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisbon weather</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f7f4ee; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #14213d; }
  .phone { width: 390px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .scene { position: relative; border-radius: 22px; overflow: hidden; box-shadow: 0 6px 20px rgba(20,33,61,.18); }
  canvas { display: block; width: 100%; height: 470px; }
  .msg { position: absolute; left: 14px; right: 14px; top: 14px; padding: 10px 14px; border-radius: 14px;
         background: rgba(255,255,255,.82); backdrop-filter: blur(6px); transition: opacity .8s; }
  .msg small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .05em; color: #4a5568; text-transform: uppercase; }
  .msg p { margin: 2px 0 0; font-size: 16px; font-weight: 700; line-height: 1.3; }
  .pills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pills button { min-height: 44px; border-radius: 12px; border: 2px solid #d9d3c7; background: #fff; font-size: 20px; cursor: pointer; }
  .pills button[aria-pressed="true"] { border-color: #14213d; background: #14213d; }
  .note { font-size: 12px; color: #4a5568; text-align: center; margin: 0; }
</style>
</head>
<body>
<div class="phone">
  <div class="scene">
    <canvas id="c" width="716" height="940"></canvas>
    <div class="msg" id="msg"><small id="sub"></small><p id="text"></p></div>
  </div>
  <div class="pills" id="pills"></div>
  <p class="note">Demo buttons: try the 5 moods (in the app the mood comes from the leaderboard)</p>
</div>

<script>
// ---------------------------------------------------------------
// The 5 moods. Every number is a "dial" of the scene. Between two
// moods the dials turn slowly, so the weather melts into the next.
// ---------------------------------------------------------------
const MOODS = [
  { icon: '☀️', sub: '#1 · 3 spots ahead', text: "Golden hour over Lisbon. The city is yours.",
    top: '#3a8ee6', bottom: '#ffd9a0', sun: 1, cloud: 0.12, grey: 0, dark: 0, rain: 0, rainbow: 0, wind: 0.25, birds: 1, motes: 1, leaves: 0, happy: 1 },
  { icon: '🌤️', sub: '#1 · 1 spot ahead', text: "Still in the sun… but Marta is right behind you.",
    top: '#4f97dd', bottom: '#ffe6c2', sun: 0.85, cloud: 0.4, grey: 0.05, dark: 0.03, rain: 0, rainbow: 0, wind: 0.55, birds: 0.6, motes: 0.5, leaves: 0.2, happy: 0.8 },
  { icon: '⛅', sub: '#2 · 1 spot behind Marta', text: "The wind is turning. One more spot and the sun breaks through.",
    top: '#7d9dc2', bottom: '#f1dcc4', sun: 0.45, cloud: 0.7, grey: 0.25, dark: 0.12, rain: 0, rainbow: 0, wind: 1.3, birds: 0.15, motes: 0.15, leaves: 1, happy: 0.5 },
  { icon: '🌦️', sub: '#3 · 3 spots behind Marta', text: "Soft rain on the rooftops. Look, a rainbow over Alfama…",
    top: '#56677e', bottom: '#aab6c3', sun: 0.12, cloud: 0.9, grey: 0.6, dark: 0.38, rain: 0.45, rainbow: 0.85, wind: 0.6, birds: 0, motes: 0, leaves: 0.2, happy: 0.3 },
  { icon: '🌧️', sub: '0 spots this month', text: "A rainy evening in Lisbon. The cafés are warm. Your first spot is waiting.",
    top: '#323f52', bottom: '#717f93', sun: 0, cloud: 1, grey: 0.85, dark: 0.62, rain: 1, rainbow: 0.35, wind: 0.45, birds: 0, motes: 0, leaves: 0, happy: 0.15 },
];
const DIALS = ['sun', 'cloud', 'grey', 'dark', 'rain', 'rainbow', 'wind', 'birds', 'motes', 'leaves', 'happy'];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.scale(2, 2); // draw at double resolution so it stays sharp on phones
const W = cv.width / 2, H = cv.height / 2;
const HORIZON = H * 0.5, STREET = H * 0.8;

// Small helpers -------------------------------------------------
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = typeof a === 'string' ? hex(a) : a, B = typeof b === 'string' ? hex(b) : b; return A.map((v, i) => v + (B[i] - v) * t); };
const rgb = (c, a = 1) => `rgba(${c.map(Math.round).join(',')},${a})`;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const NIGHT = [30, 36, 54];

// Current dial values (start at mood 0) --------------------------
const now = { top: hex(MOODS[0].top), bottom: hex(MOODS[0].bottom) };
DIALS.forEach((d) => (now[d] = MOODS[0][d]));
let target = 0;

// Fixed scenery, generated once -----------------------------------
const PALETTE = ['#f6c85f', '#f4a3a8', '#9fc5e8', '#f7e3b5', '#b5d8a7', '#e8a87c', '#c9b6e4', '#fbe7a1'];
const houses = [];
for (let x = -10; x < W + 10;) {
  const w = 44 + rnd() * 26, h = 70 + rnd() * 55;
  const cols = w > 58 ? 3 : 2, rows = Math.floor((h - 18) / 24);
  const wins = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) wins.push({ r, c, lit: rnd(), flick: rnd() * 10 });
  houses.push({ x, w, h, color: PALETTE[Math.floor(rnd() * PALETTE.length)], cols, rows, wins, tiles: rnd() < 0.35, chimney: rnd() < 0.5 });
  x += w + 2;
}
const clouds = Array.from({ length: 9 }, (_, i) => ({ x: rnd() * W * 1.4 - 60, y: 40 + rnd() * 110, s: 0.7 + rnd() * 0.8, v: 6 + rnd() * 8, order: i, puffs: Array.from({ length: 6 }, () => [rnd() * 70 - 35, rnd() * 18 - 9, 16 + rnd() * 14]) }));
const drops = Array.from({ length: 260 }, () => ({ x: rnd() * W, y: rnd() * H, l: 10 + rnd() * 12, v: 420 + rnd() * 220 }));
const splashes = [];
const motes = Array.from({ length: 40 }, () => ({ x: rnd() * W, y: rnd() * H, r: 0.8 + rnd() * 1.8, v: 6 + rnd() * 10, p: rnd() * 6 }));
const leaves = Array.from({ length: 10 }, () => ({ x: rnd() * W, y: 150 + rnd() * 220, v: 60 + rnd() * 60, spin: rnd() * 6, c: rnd() < 0.5 ? '#d97706' : '#a16207' }));
const birds = Array.from({ length: 5 }, (_, i) => ({ x: rnd() * W, y: 70 + rnd() * 80, v: 18 + rnd() * 14, p: rnd() * 6 }));

// Drawing pieces --------------------------------------------------
function sky() {
  const g = ctx.createLinearGradient(0, 0, 0, STREET);
  g.addColorStop(0, rgb(now.top)); g.addColorStop(1, rgb(now.bottom));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function sun(t) {
  if (now.sun < 0.02) return;
  const x = W * 0.74, y = 120 + (1 - now.sun) * 40;
  const glow = ctx.createRadialGradient(x, y, 10, x, y, 230);
  glow.addColorStop(0, `rgba(255,236,170,${0.75 * now.sun})`); glow.addColorStop(1, 'rgba(255,236,170,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.05);
  for (let i = 0; i < 14; i++) {  // soft god rays
    ctx.rotate((Math.PI * 2) / 14);
    const rg = ctx.createLinearGradient(0, 0, 0, 260);
    rg.addColorStop(0, `rgba(255,240,190,${0.22 * now.sun})`); rg.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(-6, 20); ctx.lineTo(6, 20); ctx.lineTo(26, 260); ctx.lineTo(-26, 260); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = `rgba(255,214,110,${now.sun})`; ctx.beginPath(); ctx.arc(x, y, 30, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(255,246,214,${now.sun})`; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.fill();
}
function rainbow() {
  if (now.rainbow < 0.02) return;
  ctx.save(); ctx.globalAlpha = now.rainbow * 0.55; ctx.lineWidth = 7;
  ['#ef4444', '#f59e0b', '#fde047', '#22c55e', '#3b82f6', '#8b5cf6'].forEach((c, i) => {
    ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(W * 0.72, HORIZON + 40, 150 - i * 7, Math.PI, 0); ctx.stroke();
  });
  ctx.restore();
}
function hills() {
  const haze = mix(mix('#9db4cc', now.bottom, 0.45), NIGHT, now.dark * 0.8);
  ctx.fillStyle = rgb(haze);
  ctx.beginPath(); ctx.moveTo(0, HORIZON + 30);
  ctx.bezierCurveTo(W * 0.2, HORIZON - 20, W * 0.35, HORIZON - 30, W * 0.5, HORIZON - 25);
  ctx.bezierCurveTo(W * 0.7, HORIZON - 18, W * 0.85, HORIZON + 10, W, HORIZON + 5);
  ctx.lineTo(W, STREET); ctx.lineTo(0, STREET); ctx.fill();
  // Castelo de São Jorge on the hill
  const cx = W * 0.42, cy = HORIZON - 26;
  ctx.fillStyle = rgb(mix(haze, NIGHT, 0.25));
  ctx.fillRect(cx - 46, cy - 18, 92, 20);
  for (const [dx, h] of [[-46, 30], [-12, 38], [22, 32], [40, 26]]) {
    ctx.fillRect(cx + dx, cy - h, 14, h);
    for (let k = 0; k < 3; k++) ctx.fillRect(cx + dx + k * 5, cy - h - 4, 3, 4);
  }
  for (let k = 0; k < 18; k++) ctx.fillRect(cx - 46 + k * 5.2, cy - 22, 3, 4);
  // flag waves with the wind
  ctx.strokeStyle = rgb(mix(haze, NIGHT, 0.3)); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx - 5, cy - 38); ctx.lineTo(cx - 5, cy - 54); ctx.stroke();
  ctx.fillStyle = `rgba(200,40,50,${1 - now.dark * 0.6})`;
  ctx.beginPath(); ctx.moveTo(cx - 5, cy - 54);
  const wv = Math.sin(performanceT * (2 + now.wind * 4)) * 2;
  ctx.quadraticCurveTo(cx + 3, cy - 52 + wv, cx + 11, cy - 51); ctx.lineTo(cx - 5, cy - 46); ctx.fill();
}
function cloudLayer(dt) {
  const visible = now.cloud * clouds.length;
  for (const c of clouds) {
    c.x += c.v * (0.4 + now.wind) * dt;
    if (c.x > W + 80) c.x = -90;
    const a = clamp(visible - c.order);
    if (a <= 0) continue;
    const base = mix([255, 255, 255], [148, 158, 172], now.grey);
    for (const [dx, dy, r] of c.puffs) {
      const px = c.x + dx * c.s, py = c.y + dy * c.s, pr = r * c.s;
      const g = ctx.createRadialGradient(px - pr * 0.3, py - pr * 0.4, pr * 0.2, px, py, pr);
      g.addColorStop(0, rgb(mix(base, [255, 255, 255], 0.35), a * 0.95));
      g.addColorStop(1, rgb(mix(base, NIGHT, 0.25), a * 0.85));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.fill();
    }
  }
}
function birdLayer(t, dt) {
  if (now.birds < 0.02) return;
  ctx.strokeStyle = `rgba(40,48,66,${now.birds * 0.8})`; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const b of birds) {
    b.x += b.v * dt; if (b.x > W + 20) b.x = -20;
    const f = Math.sin(t * 5 + b.p) * 5, y = b.y + Math.sin(t * 0.8 + b.p) * 6;
    ctx.beginPath(); ctx.moveTo(b.x - 9, y - f); ctx.quadraticCurveTo(b.x - 4, y - 4, b.x, y); ctx.quadraticCurveTo(b.x + 4, y - 4, b.x + 9, y - f); ctx.stroke();
  }
}
function houseLayer(t) {
  const shade = now.dark * 0.75;
  for (const h of houses) {
    const top = STREET - h.h;
    ctx.fillStyle = rgb(mix(h.color, NIGHT, shade)); ctx.fillRect(h.x, top, h.w, h.h);
    if (h.tiles) { // azulejo pattern
      ctx.fillStyle = rgb(mix('#3b6fb6', NIGHT, shade), 0.35);
      for (let yy = top + 6; yy < STREET - 4; yy += 8) for (let xx = h.x + 3; xx < h.x + h.w - 3; xx += 8) ctx.fillRect(xx, yy, 3, 3);
    }
    // roof
    ctx.fillStyle = rgb(mix('#b4532a', NIGHT, shade));
    ctx.beginPath(); ctx.moveTo(h.x - 3, top); ctx.lineTo(h.x + h.w / 2, top - 16); ctx.lineTo(h.x + h.w + 3, top); ctx.fill();
    if (h.chimney) ctx.fillRect(h.x + h.w * 0.7, top - 14, 6, 10);
    // windows: light up one by one as it gets darker, and flicker softly
    const ww = (h.w - 10) / h.cols - 6;
    for (const w of h.wins) {
      const wx = h.x + 8 + w.c * (ww + 6), wy = top + 10 + w.r * 24;
      if (wy + 14 > STREET - 6) continue;
      const lit = clamp((now.dark * 1.8 - w.lit) * 4);
      const flick = 0.9 + Math.sin(t * 3 + w.flick) * 0.1;
      const glass = mix(mix('#cfe3f5', NIGHT, shade), [255, 206, 120], lit * flick);
      ctx.fillStyle = rgb(glass); ctx.fillRect(wx, wy, ww, 13);
      if (lit > 0.1) { ctx.fillStyle = `rgba(255,190,100,${0.18 * lit})`; ctx.fillRect(wx - 4, wy - 4, ww + 8, 21); }
      ctx.fillStyle = rgb(mix('#ffffff', NIGHT, shade), 0.6); ctx.fillRect(wx, wy + 13, ww, 2); // sill
    }
  }
}
function street() {
  const base = mix('#e6dfd0', NIGHT, now.dark * 0.7);
  ctx.fillStyle = rgb(base); ctx.fillRect(0, STREET, W, H - STREET);
  // calçada portuguesa: black-and-white wave pattern
  ctx.strokeStyle = rgb(mix('#4b4f5c', NIGHT, now.dark * 0.5), 0.3); ctx.lineWidth = 2.5;
  for (let row = 0; row < 4; row++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 6) { const y = STREET + 18 + row * 22 + Math.sin(x / 26 + row) * 5; x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // wet street: reflections of the lit windows
  if (now.rain > 0.05) {
    for (const h of houses) {
      ctx.fillStyle = `rgba(255,200,120,${0.12 * now.rain * now.dark * 2})`;
      ctx.fillRect(h.x + h.w * 0.25, STREET + 2, h.w * 0.5, 50 + h.h * 0.3);
    }
  }
}
let tramX = -80;
function tram(t, dt) {
  tramX += (28 + now.happy * 22) * dt; if (tramX > W + 90) tramX = -90;
  const hop = Math.abs(Math.sin(t * 6)) * 5 * now.happy;
  const x = tramX, y = STREET + 8 - hop;
  const body = mix('#f5b82e', NIGHT, now.dark * 0.35);
  // headlight beam in the dark
  if (now.dark > 0.1) {
    const beam = ctx.createRadialGradient(x + 50, y - 22, 2, x + 70, y - 18, 70);
    beam.addColorStop(0, `rgba(255,236,170,${now.dark * 0.8})`); beam.addColorStop(1, 'rgba(255,236,170,0)');
    ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(x + 46, y - 26); ctx.lineTo(x + 140, y - 50); ctx.lineTo(x + 140, y + 10); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x, STREET + 12, 46, 5, 0, 0, 7); ctx.fill();
  // pole
  ctx.strokeStyle = '#14213d'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x - 6, y - 62); ctx.lineTo(x - 20, y - 92); ctx.stroke();
  // body
  ctx.fillStyle = rgb(body); roundRect(x - 46, y - 64, 92, 58, 14); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#14213d'; ctx.stroke();
  ctx.fillStyle = rgb(mix('#fff7e6', NIGHT, now.dark * 0.3)); ctx.fillRect(x - 46, y - 22, 92, 7);
  // windows (warm inside when dark)
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = rgb(mix('#cfe3f5', [255, 206, 120], now.dark)); roundRect(x - 40 + i * 20, y - 54, 15, 20, 3); ctx.fill();
  }
  // face window
  ctx.fillStyle = rgb(mix('#dbeafe', [255, 226, 160], now.dark * 0.6)); roundRect(x + 18, y - 56, 24, 30, 5); ctx.fill();
  ctx.fillStyle = '#14213d';
  const lookUp = (1 - now.happy) * 3;
  if (now.happy > 0.7) { // happy closed eyes
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + 25, y - 44, 3, Math.PI, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(x + 36, y - 44, 3, Math.PI, 0); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x + 25, y - 44 - lookUp, 2.8, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(x + 36, y - 44 - lookUp, 2.8, 0, 7); ctx.fill();
  }
  ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + 30.5, y - 37, 4 + now.happy * 2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  // headlight
  ctx.fillStyle = now.dark > 0.1 ? '#fff4c2' : '#ffffff'; ctx.beginPath(); ctx.arc(x + 41, y - 14, 4, 0, 7); ctx.fill();
  // wheels turning
  for (const wx of [x - 26, x + 26]) {
    ctx.fillStyle = '#14213d'; ctx.beginPath(); ctx.arc(wx, y - 4, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; const a = tramX / 9;
    ctx.beginPath(); ctx.moveTo(wx + Math.cos(a) * 6, y - 4 + Math.sin(a) * 6); ctx.lineTo(wx - Math.cos(a) * 6, y - 4 - Math.sin(a) * 6); ctx.stroke();
  }
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function rainLayer(dt) {
  if (now.rain < 0.02) { splashes.length = 0; return; }
  const n = Math.floor(drops.length * now.rain), slant = 0.18 + now.wind * 0.15;
  ctx.strokeStyle = `rgba(200,220,245,${0.35 + now.rain * 0.3})`; ctx.lineWidth = 1.3;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const d = drops[i];
    d.y += d.v * dt; d.x += d.v * slant * dt;
    if (d.y > STREET + 10 + (i % 7) * 12) {
      if (i % 3 === 0) splashes.push({ x: d.x, y: d.y, age: 0 });
      d.y = -20 - Math.random() * 80; d.x = Math.random() * (W + 80) - 80;
    }
    ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * slant, d.y - d.l);
  }
  ctx.stroke();
  ctx.strokeStyle = `rgba(220,232,250,${0.5 * now.rain})`;
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i]; s.age += dt;
    if (s.age > 0.35) { splashes.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - s.age / 0.35; ctx.beginPath(); ctx.ellipse(s.x, s.y, 2 + s.age * 18, 1 + s.age * 4, 0, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function moteLayer(t, dt) {
  if (now.motes < 0.02) return;
  for (const m of motes) {
    m.y -= m.v * dt; m.x += Math.sin(t + m.p) * 6 * dt; if (m.y < 0) { m.y = H; m.x = Math.random() * W; }
    ctx.fillStyle = `rgba(255,230,160,${now.motes * (0.4 + 0.4 * Math.sin(t * 2 + m.p))})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill();
  }
}
function leafLayer(t, dt) {
  if (now.leaves < 0.02) return;
  for (const l of leaves) {
    l.x += l.v * now.wind * dt; l.y += Math.sin(t * 2 + l.spin) * 20 * dt;
    if (l.x > W + 10) { l.x = -10; l.y = 150 + Math.random() * 220; }
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(t * 3 + l.spin); ctx.globalAlpha = now.leaves;
    ctx.fillStyle = l.c; ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.4, 0, 0, 7); ctx.fill(); ctx.restore();
  }
}
function mood() {
  // cool grey haze in the rain, warm golden light in the sun
  if (now.dark > 0) { ctx.fillStyle = `rgba(40,52,72,${now.dark * 0.22})`; ctx.fillRect(0, 0, W, H); }
  if (now.sun > 0) { ctx.fillStyle = `rgba(255,190,90,${now.sun * 0.08})`; ctx.fillRect(0, 0, W, H); }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(10,15,30,${0.15 + now.dark * 0.25})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// Loop ------------------------------------------------------------
let last = null, performanceT = 0;
window.setTime = null; // set a number to control time (used for recordings)
function frame(ms) {
  const t = window.setTime ?? ms / 1000;
  const dt = last === null ? 0 : clamp(t - last, 0, 0.1); last = t; performanceT = t;
  // turn every dial a little towards the target mood (about 2.5 s for a full change)
  const goal = MOODS[target], k = 1 - Math.pow(0.18, dt);
  DIALS.forEach((d) => (now[d] += (goal[d] - now[d]) * k));
  now.top = mix(now.top, goal.top, k); now.bottom = mix(now.bottom, goal.bottom, k);

  sky(); sun(t); rainbow(); cloudLayer(dt); birdLayer(t, dt); hills(); houseLayer(t);
  street(); tram(t, dt); leafLayer(t, dt); moteLayer(t, dt); rainLayer(dt); mood();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Message + demo buttons ------------------------------------------
const pills = document.getElementById('pills');
function setMood(i) {
  target = i;
  const msg = document.getElementById('msg');
  msg.style.opacity = 0;
  setTimeout(() => {
    document.getElementById('sub').textContent = MOODS[i].sub;
    document.getElementById('text').textContent = MOODS[i].text;
    msg.style.opacity = 1;
  }, window.setTime === null ? 500 : 0);
  [...pills.children].forEach((b, j) => b.setAttribute('aria-pressed', String(i === j)));
}
MOODS.forEach((m, i) => {
  const b = document.createElement('button'); b.textContent = m.icon; b.setAttribute('aria-label', m.sub);
  b.onclick = () => setMood(i); pills.appendChild(b);
});
setMood(0);
window.setMood = setMood;
window.ready = true;
</script>
