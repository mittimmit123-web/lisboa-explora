<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lisboa Explora app icon: our tram mascot on the app's blue.
       Everything important sits inside the middle 80%, so phones that cut
       icons into circles or squircles ("maskable") don't cut off the tram. -->
  <rect width="512" height="512" fill="#1E4D8C"/>
  <circle cx="256" cy="256" r="196" fill="#2A5FA5"/>
  <!-- pole -->
  <path d="M236 150 L196 92" stroke="#14213D" stroke-width="14" stroke-linecap="round"/>
  <circle cx="196" cy="90" r="14" fill="#F5B82E" stroke="#14213D" stroke-width="8"/>
  <!-- body -->
  <rect x="128" y="146" width="256" height="196" rx="52" fill="#F5B82E" stroke="#14213D" stroke-width="14"/>
  <rect x="135" y="286" width="242" height="24" fill="#FFF7E6"/>
  <!-- face window -->
  <rect x="168" y="178" width="176" height="94" rx="22" fill="#DBEAFE" stroke="#14213D" stroke-width="10"/>
  <circle cx="220" cy="218" r="14" fill="#14213D"/>
  <circle cx="292" cy="218" r="14" fill="#14213D"/>
  <circle cx="215" cy="213" r="5" fill="#FFFFFF"/>
  <circle cx="287" cy="213" r="5" fill="#FFFFFF"/>
  <path d="M232 244 Q256 262 280 244" fill="none" stroke="#14213D" stroke-width="10" stroke-linecap="round"/>
  <circle cx="190" cy="246" r="10" fill="#FB7185" opacity="0.6"/>
  <circle cx="322" cy="246" r="10" fill="#FB7185" opacity="0.6"/>
  <!-- lights and wheels -->
  <circle cx="160" cy="324" r="10" fill="#FFFFFF" stroke="#14213D" stroke-width="5"/>
  <circle cx="352" cy="324" r="10" fill="#FFFFFF" stroke="#14213D" stroke-width="5"/>
  <circle cx="190" cy="362" r="28" fill="#14213D"/>
  <circle cx="322" cy="362" r="28" fill="#14213D"/>
  <circle cx="190" cy="362" r="10" fill="#9CA3AF"/>
  <circle cx="322" cy="362" r="10" fill="#9CA3AF"/>
  <!-- calçada wave -->
  <path d="M96 404 Q136 390 176 404 T256 404 T336 404 T416 404" fill="none" stroke="#FFF7E6" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
</svg>
